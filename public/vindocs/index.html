<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vindocs — Chuyển đổi tài liệu sang Markdown | Vincode</title>
  <meta name="description" content="Chuyển đổi PDF, Word, hình ảnh sang Markdown chuẩn. Hỗ trợ OCR tiếng Việt bằng AI. Upload hàng loạt." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-inner">
        <div class="logo">
          <a href="/">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
              <polyline points="10 9 9 9 8 9"/>
            </svg>
            <span>Vin<span class="accent">docs</span></span>
          </a>
        </div>
        <p class="tagline">PDF · Word · Image → Markdown</p>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main">
      <!-- Upload Zone -->
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.webp,.bmp,.tiff" multiple hidden />
        <div class="upload-content">
          <div class="upload-icon">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <p class="upload-text">Kéo thả file vào đây</p>
          <p class="upload-sub">hoặc <button class="browse-btn" id="browseBtn">chọn file</button> · hỗ trợ nhiều file cùng lúc</p>
          <p class="upload-formats">PDF · DOCX · PNG · JPG · WebP · BMP · TIFF</p>
        </div>
      </div>

      <!-- File List -->
      <div class="file-list" id="fileList" hidden></div>

      <!-- Convert Button -->
      <button class="convert-btn" id="convertBtn" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/>
          <polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/>
        </svg>
        <span id="convertBtnText">Chuyển đổi sang Markdown</span>
      </button>

      <!-- Progress -->
      <div class="progress-section" id="progressSection" hidden>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <p class="progress-text" id="progressText">Đang xử lý...</p>
      </div>

      <!-- Results Container -->
      <div id="resultsContainer"></div>

      <!-- Error -->
      <div class="error-section" id="errorSection" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
        </svg>
        <p id="errorText"></p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>© 2026 <a href="https://vincode.xyz">vincode.xyz</a></p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.0/marked.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
